title: Suppression des clichés instantanés par vssadmin
id: 523cfd3b-38e1-467c-9b1f-5d126f01be0f
status: experimental
description: Détecte l'utilisation de vssadmin pour supprimer les clichés instantanés, ce qui est souvent utilisé par les ransomwares pour empêcher la récupération des fichiers.
references:
  - https://attack.mitre.org/techniques/T1490/
author: Romain Gueninchault, Joao Abreu, Marie Rougier
date: 2026-11-10
tags:
  - attack.t1490
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith: '\vssadmin.exe'
  selection_command:
      CommandLine|contains|all:
        - 'delete'
        - 'shadows'
  condition: selection_image and selection_command
falsepositives:
  - Utilisation légitime de vssadmin pour la gestion des clichés instantanés par les administrateurs système.
level: high